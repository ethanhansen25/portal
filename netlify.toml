# Oakframe Media OS — Netlify config
# Static site, no build step. Routing is client-side (hash-based, "#/..."),
# so every request is simply served index.html — no SPA rewrite rule needed.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long-cache the vendored library and fonts-less static assets; index.html and
# the app's own JS/CSS stay short-cache so a redeploy is picked up immediately.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
